# Pinned so that CI and a contributor's machine run the same binaries.
#
# go must match the go directive in go.mod. golangci-lint refuses to load a
# module whose directive is newer than the Go it was built with, so drift
# between the two surfaces as an unrelated-looking lint failure. The toolchain
# task checks the pair.
[tools]
go = "1.27.0"
golangci-lint = "2.13.1"
"github:mpyw/declscope" = "0.1.0"

[tasks.toolchain]
description = "go.mod and mise.toml agree on the Go version"
run = '''
mod=$(sed -n 's/^go \(.*\)$/\1/p' go.mod)
pin=$(sed -n 's/^go = "\(.*\)"/\1/p' mise.toml)
if [ "$mod" != "$pin" ]; then
  echo "go.mod go=$mod but mise.toml go=$pin" >&2
  exit 1
fi
echo "toolchain $mod"
'''

[tasks.test]
description = "analysistest and unit tests"
run = 'go test ./...'

[tasks.lint]
description = "golangci-lint"
run = 'golangci-lint run ./...'

[tasks.declscope]
description = "File-granularity visibility inside each package"
run = 'declscope ./...'

[tasks.cover]
description = "One coverage profile for the module (coverage.txt)"
run = 'go test -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...'

[tasks.check]
description = "Full gate: toolchain, test, lint, declscope"
depends = ["toolchain", "test", "lint", "declscope"]
