name: CI

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Every tool is pinned in mise.toml, so CI and a contributor's machine run
      # the same binaries. The check task verifies that mise.toml's go still
      # matches go.mod's, which golangci-lint is strict about.
      - uses: jdx/mise-action@v2
        with:
          cache: true

      # toolchain, test, lint, declscope.
      - run: mise run check

      # Coverage is its own task so that the gate above stays fast.
      - run: mise run cover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
