name: Corpus

# Runs the analyzer over pinned commits of real modules and diffs the result
# against testdata/corpus/ (see scripts/corpus.sh). It downloads the modules
# and their dependencies, so it runs only when analyzer code changes.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - scripts/corpus.sh
      - testdata/corpus/**
      - .github/workflows/corpus.yml

permissions:
  contents: read

jobs:
  corpus:
    name: Corpus diff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The latest 1.27 patch, not the go directive in go.mod: setup-go sets
          # GOTOOLCHAIN=local, and the corpus modules need up to go 1.27.3.
          go-version: "1.27"
          cache: false

      # The module cache and the clones are keyed on the pinned commits.
      - name: Cache corpus
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/zerologlintctx-corpus
          key: corpus-${{ hashFiles('scripts/corpus.sh', 'go.sum') }}

      - name: Run corpus diff
        run: scripts/corpus.sh
