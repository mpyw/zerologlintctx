# declscope baseline
#
# Violations recorded here are suppressed; new ones are still reported.
# Regenerate with:
#
#     declscope baseline ./...
#
# Do not edit by hand. An entry disappears when its violation is fixed, so the
# diff of a regeneration is the record of what was cleaned up.
packages:
  github.com/mpyw/zerologlintctx/internal/ssa:
    boundary:
      tracing:
        - Checker.traceValue
        - instrsIn
        - tracerEvent
    qualify:
      tracing:
        - addressesMatch
        - aggregateBase
        - aggregateCopySource
        - aggregatePath
        - checkContext
        - checkContextForContext
        - checkContextForEvent
        - checkContextForLogger
        - checkResult
        - constIndexesMatch
        - copySourcesOf
        - delegation
        - edgeLeadsTo
        - edgeLeadsToImpl
        - findAllStoredValues
        - findStoredValues
        - findStoresThroughAggregateCopy
        - instrsIn
        - isNilConst
        - parentFunc
        - resolvePath
        - selectsSameElement
        - shouldContinueOnReceiver
        - traceAllStoredValues
        - traceAlloc
        - traceCommon
        - traceFreeVar
        - traceIIFEReturns
        - tracePhi
        - traceReceiver
        - traceUnOp
        - traceValue
        - tracerContext
        - tracerEvent
        - tracerLogger
        - tracerType
        - unwrapInner
        - valueLoadsFrom
